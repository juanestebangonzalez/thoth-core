spring:
  application:
    name: thoth-core
  profiles:
    active: dev
  jpa:
    open-in-view: false

server:
  port: 8080
  error:
    
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: INFO
    com.thoth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # DT-31: info endpoint con datos de la app
  info:
    env:
      enabled: true

info:
  app:
    name: THOTH C.O.R.E.
    description: Control, Ordenamiento, Registro de Equipos
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  name: THOTH C.O.R.E
  version: 1.0.0

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

app.upload.dir: uploads