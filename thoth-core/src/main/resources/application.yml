spring:
  application:
    name: thoth-core
  profiles:
    active: dev
  jpa:
    open-in-view: false
  # Correo saliente (recuperacion de contrasena). Solo se usa si thoth.mail.enabled=true.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    
    include-message: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.thoth: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # El correo es opcional: que un SMTP no configurado no marque la aplicacion como DOWN
  health:
    mail:
      enabled: false
  # DT-31: info endpoint con datos de la app
  info:
    env:
      enabled: true

info:
  app:
    name: THOTH C.O.R.E.
    description: Control, Ordenamiento, Registro de Equipos
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

thoth:
  # URL publica del frontend (se usa para armar el enlace de restablecimiento de contrasena)
  frontend-url: ${FRONTEND_URL:https://thoth-core.netlify.app}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}

app:
  name: THOTH C.O.R.E
  version: 1.0.0

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

app.upload.dir: uploads