spring:
  datasource:
    url: jdbc:h2:mem:thoth_core_test
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

logging:
  level:
    root: OFF
    com.thoth: INFO
