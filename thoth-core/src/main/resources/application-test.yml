spring:
  datasource:
    url: jdbc:h2:mem:thoth_core_test
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

jwt:
  secret: thoth-core-TEST-ONLY-secret-not-for-production-3d8f5a2c9e1b
  expiration: 86400000

logging:
  level:
    root: OFF
    com.thoth: INFO


security:
  rate-limit:
    max-attempts: 50
    window-ms: 60000
