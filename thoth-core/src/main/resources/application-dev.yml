spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/thoth_core
    username: ${DB_USERNAME:thoth_app}
    password: ${DB_PASSWORD:thoth_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  docker:
    compose:
      enabled: false

jwt:
  secret: ${JWT_SECRET:thoth-core-DEV-ONLY-secret-not-for-production-6f2a9c1e7b4d}
  expiration: 86400000

logging:
  level:
    root: WARN
    com.thoth: DEBUG