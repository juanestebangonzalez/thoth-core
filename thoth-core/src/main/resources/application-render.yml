# Profile for Render deployment
# Activated via SPRING_PROFILES_ACTIVE=prod,render

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway migrations
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://thoth-core.netlify.app}

# Optimize for 512MB RAM
server:
  tomcat:
    max-threads: 20
    min-spare-threads: 2
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
