spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:thoth_core}
    username: ${DB_USERNAME:thoth_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

cors:
  allowed-origins: https://thoth-core.netlify.app

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    root: WARN
    com.thoth: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# SEC-017: Swagger UI / OpenAPI docs expose the entire API surface (every
# endpoint, request/response schema) and are permitAll() in SecurityConfig -
# fine for dev, but unnecessary reconnaissance surface in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false